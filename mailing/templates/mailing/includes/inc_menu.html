<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">SkyMailing</h5>
    <nav class="ms-5 d-flex gap-2">
        <a class="btn btn-outline-primary" href="{% url 'mailing:home' %}">Главная</a>
        {% if user.is_authenticated %}
        <form action="{% url 'logout' %}" method="post" class="m-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-primary">Выйти</button>
        </form>
        {% else %}
        <a class="btn btn-outline-primary" href="{% url 'users:login' %}">Вход</a>
        <a class="btn btn-outline-primary" href="{% url 'users:register' %}">Зарегистрироваться</a>
        {% endif %}
    </nav>
</div>
